name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: astral-sh/setup-uv@v6
              with:
                version: "0.12.19"
                python-version: "3.14"
                enable-cache: true

            - name: Install dependencies
              run: uv sync --frozen

            - name: Lint
              run: uv run ruff check .

            - name: Test
              run: uv run pytest

    docker:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@v5

            - name: Build image
              run: docker build -t cutopt:ci .

