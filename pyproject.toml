[project]
name = "cutopt"
version = "0.1.0"
description = "Timber cut list optimizer: greedy vs CP-SAT for the 1D cutting stock problem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
cpsat = ["ortools>=9.10"]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "ipykernel>=7.4.0",
]

[project.scripts]
cutopt = "cutopt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cutopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
